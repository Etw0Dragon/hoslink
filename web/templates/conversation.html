{{define "conversation"}}<a class="back" href="/messages">← Tous les échanges</a><h1>{{.Item.Subject}}</h1><div class="thread">{{range .Messages}}<article class="message card"><div class="split"><strong>{{.Name}}</strong><small>{{.Date}}</small></div><p class="pre">{{.Body}}</p>{{if .OtherID}}<a class="attachment" href="/documents/{{.OtherID}}">↓ {{.FileName}}</a>{{end}}</article>{{end}}</div><section class="card"><h2>Poursuivre l’échange</h2><form action="/messages/{{.Item.ID}}" method="post" enctype="multipart/form-data">{{template "csrf" .}}<label>Message<textarea name="body" maxlength="10000" rows="4"></textarea></label><label>Joindre un devis PDF · 5 Mo maximum<input type="file" name="document" accept="application/pdf,.pdf"></label><button>Envoyer ↗</button></form></section>{{end}}
