name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hoslink_test
          POSTGRES_USER: hoslink_ci
          # Ephemeral CI database only; no production credential.
          POSTGRES_PASSWORD: ci_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoslink_ci -d hoslink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://hoslink_ci:ci_only_disposable@localhost:5432/hoslink_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal web public)"
      - name: Analyze
        run: go vet ./...
      - name: Test including database isolation and capacity
        run: go test -race -count=1 ./...
      - name: Compile server and static exporter
        run: go build ./...
      - name: Check JavaScript syntax
        run: node --check web/static/app.js
      - name: Build static preview
        run: go run ./cmd/preview -out dist -base-path /hoslink
      - name: Store preview for pull request review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoslink-preview-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7
          if-no-files-found: error
