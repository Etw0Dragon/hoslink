name: CI
on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Keep this required-check name until the remote branch protection is updated.
    name: Go and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hoslink_ts_test
          POSTGRES_USER: hoslink_ci
          POSTGRES_PASSWORD: ci_only_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hoslink_ci -d hoslink_ts_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://hoslink_ci:ci_only_disposable@localhost:5432/hoslink_ts_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t hoslink:test .
