name: Signaler un problème
description: Décrire un problème observé dans Hoslink
title: "[Bug] "
body:
  - type: input
    id: page
    attributes:
      label: Page et version
      description: URL et, si possible, commit ou date de l’aperçu.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes, résultat observé et résultat attendu
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Navigateur et appareil
