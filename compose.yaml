x-app: &app
  build: .
  environment: &app-env
    NODE_ENV: ${NODE_ENV:-production}
    PORT: 8080
    DATABASE_URL: postgres://hoslink:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}@db:5432/hoslink_node
    BASE_URL: ${BASE_URL:-https://hoslink.tmfolio.site}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Définir BETTER_AUTH_SECRET}
    SMTP_URL: ${SMTP_URL:-}
    MAIL_FROM: ${MAIL_FROM:-noreply@hoslink.tmfolio.site}
    MAIL_DIR: /app/var/mail
  networks: [private, default]
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hoslink_node
      POSTGRES_USER: hoslink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    volumes:
      - hoslink_ts_pg18:/var/lib/postgresql
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/010-test-db.sql:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hoslink -d hoslink_node"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [node, dist/db/migrate.js]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    <<: *app
    expose: ["8080"]
    volumes:
      - hoslink_ts_mail:/app/var/mail
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
networks:
  private:
    internal: true
volumes:
  hoslink_ts_pg18:
  hoslink_ts_mail:
